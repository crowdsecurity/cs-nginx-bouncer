name: release-package

on:
  release:
    types: prereleased

permissions: {}

jobs:
  release-package:
    name: Upload release package
    runs-on: ubuntu-latest
    permissions:
      contents: write # to upload the package to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the Makefile derives BUILD_VERSION from the tags
          fetch-depth: 0
          persist-credentials: false

      - name: make the package
        run: make release

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" crowdsec-nginx-bouncer.tgz --clobber
