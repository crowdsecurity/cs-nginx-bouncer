name: vendored-dependencies

# Dependabot has no Lua/luarocks ecosystem, so vendored dependencies
# (vendor/vendor.conf) are kept up to date by this workflow instead.

on:
  pull_request:
    paths:
      - vendor/**
      - scripts/vendor.sh
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    name: Verify vendored files match upstream
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: ./scripts/vendor.sh verify

  update:
    name: Open PRs for outdated dependencies
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the update branches
      pull-requests: write # to open the update PRs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # needed to push the update branches
          persist-credentials: true

      - name: Report upstream security advisories
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/vendor.sh advisories | sed 's/^/::warning::/'

      - name: Open update PRs
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          while read -r name current latest; do
            branch="vendor/${name}-${latest}"
            if git ls-remote --exit-code --heads origin "${branch}" > /dev/null; then
              echo "${branch} already exists, skipping"
              continue
            fi

            git checkout -q -B "${branch}" "origin/${BASE}"
            ./scripts/vendor.sh update "${name}" "${latest}" < /dev/null
            git add vendor/
            git commit -q -m "vendor: bump ${name} from ${current} to ${latest}"
            git push -q origin "${branch}"

            gh pr create --base "${BASE}" --head "${branch}" \
              --title "vendor: bump ${name} from ${current} to ${latest}" \
              --body "Bumps vendored \`${name}\` from \`${current}\` to \`${latest}\`.

          Upstream changes: $(awk -v n="${name}" '$1 == n { print $2 }' vendor/vendor.conf)/compare/${current}...${latest}

          Generated by the \`vendored-dependencies\` workflow." < /dev/null
          done < <(./scripts/vendor.sh outdated)
