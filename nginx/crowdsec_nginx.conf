lua_package_path '/usr/local/lua/crowdsec/?.lua;;';
# This shared dictionary will store both the decision cache and the LAPI health status.
lua_shared_dict crowdsec_cache 50m;

lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

#
# INITIALIZATION (runs once on Nginx start)
#
init_by_lua_block {
    cs = require "crowdsec"

    local config_path = "/data/crowdsec/crowdsec.conf"
    local user_agent = "crowdsec-npmplus-bouncer/v1.1.1"

    -- Attempt to initialize the CrowdSec library
    local ok, err = pcall(cs.init, config_path, user_agent)
    if not ok then
        ngx.log(ngx.ERR, "[Crowdsec] FATAL: Init failed: " .. tostring(err))
        -- We will let Nginx start, but CrowdSec bouncer will be disabled.
        -- We set a global flag to indicate initialization failure.
        _G.CROWDSEC_INIT_FAILED = true
    else
        ngx.log(ngx.ALERT, "[Crowdsec] Initialisation done")
        _G.CROWDSEC_INIT_FAILED = false
        -- Initialize the LAPI status as healthy in the shared cache.
        ngx.shared.crowdsec_cache:set("lapi_unreachable", false)
    end
}

map $server_addr $unix {
    default 0;
    "~unix:" 1;
}

#
# PER-REQUEST PROCESSING (runs for every request)
#
access_by_lua_block {
    -- Do not run if initialization failed
    if _G.CROWDSEC_INIT_FAILED then
        return
    end

    local cs = require "crowdsec"

    -- Ignore requests over unix sockets
    if ngx.var.unix == "1" then
        return
    end

    -- Fail-open fast: If LAPI is known to be down, allow traffic immediately.
    local lapi_down = ngx.shared.crowdsec_cache:get("lapi_unreachable")
    if lapi_down then
        ngx.log(ngx.DEBUG, "[Crowdsec] LAPI is marked as unreachable, allowing request.")
        return
    end

    -- Safely call the Allow function using a protected call to prevent crashes
    local ok, err = pcall(cs.Allow, ngx.var.remote_addr)

    -- If the call fails, log the error but allow the request to proceed.
    if not ok then
        ngx.log(ngx.ERR, "[Crowdsec] Allow() failed: " .. tostring(err))
        -- Check if it's a connection error. If so, mark LAPI as down.
        -- You may need to adjust the string matching based on actual errors.
        if type(err) == "string" and (err:find("timed out") or err:find("connection refused") or err:find("HTTP error")) then
            ngx.log(ngx.WARN, "[Crowdsec] Marking LAPI as unreachable due to connection error.")
            ngx.shared.crowdsec_cache:set("lapi_unreachable", true)
        end
        -- In any error case, we "fail open" by default.
        return
    end
}

#
# WORKER INITIALIZATION (runs once for each Nginx worker)
#
init_worker_by_lua_block {
    -- Do not run if global initialization failed
    if _G.CROWDSEC_INIT_FAILED then
        ngx.log(ngx.WARN, "[Crowdsec] Bouncer is disabled due to initialization failure.")
        return
    end
    
    local cs = require "crowdsec"
    local mode = cs.get_mode()

    -- We only need the background task on one worker to avoid redundant checks.
    if ngx.worker.id() == 0 then
        -- Define retry backoff parameters
        local INITIAL_RETRY_DELAY = 10 -- seconds
        local MAX_RETRY_DELAY = 300   -- 5 minutes
        local current_retry_delay = INITIAL_RETRY_DELAY

        local lapi_check_and_setup -- Forward declaration for the recursive timer

        lapi_check_and_setup = function(premature)
            if premature then
                return
            end

            ngx.log(ngx.INFO, "[Crowdsec] Worker 0: Running LAPI health check and stream setup...")
            
            -- Use pcall for the entire setup logic to catch any error
            local ok, err_or_result
            if string.lower(mode) == "stream" then
                ok, err_or_result = pcall(cs.SetupStream)
            else
                -- For non-stream mode, we can just ping
                ok, err_or_result = pcall(cs.ping)
            end

            if ok then
                -- SUCCESS!
                ngx.log(ngx.INFO, "[Crowdsec] LAPI connection successful. Bouncer is active.")
                ngx.shared.crowdsec_cache:set("lapi_unreachable", false)
                -- Reset the retry delay for the next time it might fail.
                current_retry_delay = INITIAL_RETRY_DELAY
                
                -- In stream mode, SetupStream already runs a recurring timer.
                -- We only need to reschedule this check if we are NOT in stream mode
                -- or if the initial setup failed. We'll schedule a periodic health check.
                if string.lower(mode) ~= "stream" then
                    ngx.timer.at(MAX_RETRY_DELAY, lapi_check_and_setup)
                end
            else
                -- FAILURE!
                ngx.log(ngx.ERR, "[Crowdsec] LAPI connection failed: " .. tostring(err_or_result))
                ngx.shared.crowdsec_cache:set("lapi_unreachable", true)

                -- Schedule the next retry with exponential backoff
                ngx.log(ngx.WARN, "[Crowdsec] Scheduling next LAPI check in " .. current_retry_delay .. " seconds.")
                ngx.timer.at(current_retry_delay, lapi_check_and_setup)

                -- Increase delay for the next attempt, up to the max
                current_retry_delay = math.min(current_retry_delay * 2, MAX_RETRY_DELAY)
            end
        end

        -- Start the first check shortly after the worker starts.
        ngx.timer.at(5, lapi_check_and_setup)

        -- Setup Metrics (also on worker 0)
        local ok, err = pcall(cs.SetupMetrics)
        if not ok then
            ngx.log(ngx.ERR, "[Crowdsec] SetupMetrics failed: " .. tostring(err))
        end
    end
}
