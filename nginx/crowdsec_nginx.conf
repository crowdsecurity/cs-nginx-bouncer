lua_package_path '/usr/local/lua/crowdsec/?.lua;;';
# This shared dictionary will store both the decision cache and the LAPI health status.
lua_shared_dict crowdsec_cache 50m;

lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

#
# PER-REQUEST PROCESSING (simplified)
#
access_by_lua_block {
    if _G.CROWDSEC_INIT_FAILED then return end

    local cs = require "crowdsec"
    if ngx.var.unix == "1" then return end

    -- We now rely only on the cache. If the background stream is down,
    -- we fail open by not finding a decision for the IP.
    local ok, err = pcall(cs.Allow, ngx.var.remote_addr)

    if not ok then
        -- This will now only catch critical errors during the pcall itself,
        -- not transient connection errors which are handled by the background worker.
        ngx.log(ngx.ERR, "[Crowdsec] Allow() failed unexpectedly: " .. tostring(err))
    end
}

map $server_addr $unix {
    default 0;
    "~unix:" 1;
}

#
# PER-REQUEST PROCESSING (runs for every request)
#
access_by_lua_block {
    -- Do not run if initialization failed
    if _G.CROWDSEC_INIT_FAILED then
        return
    end

    local cs = require "crowdsec"

    -- Ignore requests over unix sockets
    if ngx.var.unix == "1" then
        return
    end

    -- Fail-open fast: If LAPI is known to be down, allow traffic immediately.
    local lapi_down = ngx.shared.crowdsec_cache:get("lapi_unreachable")
    if lapi_down then
        ngx.log(ngx.DEBUG, "[Crowdsec] LAPI is marked as unreachable, allowing request.")
        return
    end

    -- Safely call the Allow function using a protected call to prevent crashes
    local ok, err = pcall(cs.Allow, ngx.var.remote_addr)

    -- If the call fails, log the error but allow the request to proceed.
    if not ok then
        ngx.log(ngx.ERR, "[Crowdsec] Allow() failed: " .. tostring(err))
        -- Check if it's a connection error. If so, mark LAPI as down.
        -- You may need to adjust the string matching based on actual errors.
        if type(err) == "string" and (err:find("timed out") or err:find("connection refused") or err:find("HTTP error")) then
            ngx.log(ngx.WARN, "[Crowdsec] Marking LAPI as unreachable due to connection error.")
            ngx.shared.crowdsec_cache:set("lapi_unreachable", true)
        end
        -- In any error case, we "fail open" by default.
        return
    end
}

#
# WORKER INITIALIZATION (with Supervisor Pattern)
#
init_worker_by_lua_block {
    if _G.CROWDSEC_INIT_FAILED then
        ngx.log(ngx.WARN, "[Crowdsec] Bouncer is disabled due to initialization failure.")
        return
    end

    local cs = require "crowdsec"
    local mode = cs.get_mode()

    -- Run the supervisor on a single worker to avoid duplication.
    if ngx.worker.id() == 0 then
        -- Only start the supervisor if we are in stream mode.
        if string.lower(mode) == "stream" then
            -- How long to wait before restarting the stream after a crash.
            local STREAM_RESTART_DELAY = 15 -- seconds
            local stream_supervisor

            stream_supervisor = function(premature)
                if premature then return end

                -- The cs.SetupStream function is a long-running process that
                -- contains its own loop and timers. We wrap the entire
                -- thing in a pcall. If it ever crashes (like with the 'nil value' error),
                -- pcall will catch it, and we can restart it.
                ngx.log(ngx.INFO, "[Crowdsec] Supervisor: Starting CrowdSec decision stream...")
                local ok, err = pcall(cs.SetupStream)

                if not ok then
                    ngx.log(ngx.ERR, "[Crowdsec] Supervisor: Stream process crashed with error: " .. tostring(err))
                else
                    -- This line is unlikely to be reached unless SetupStream exits cleanly.
                    ngx.log(ngx.INFO, "[Crowdsec] Supervisor: Stream process exited without error.")
                end

                -- No matter how it exited (crash or clean exit), schedule a restart.
                ngx.log(ngx.INFO, "[Crowdsec] Supervisor: Restarting stream in " .. STREAM_RESTART_DELAY .. " seconds.")
                ngx.timer.at(STREAM_RESTART_DELAY, stream_supervisor)
            end

            -- Start the supervisor for the first time.
            ngx.timer.at(0, stream_supervisor)
        end

        -- Metrics setup can remain the same.
        local ok, err = pcall(cs.SetupMetrics)
        if not ok then
            ngx.log(ngx.ERR, "[Crowdsec] SetupMetrics failed: " .. tostring(err))
        end
    end
}
